---
name: Formatting Terraform Code
run-name: "${{ github.actor }} is running Formatting Terraform Code"
on:
    push:
        branches:
            - main
env:
    TF_VERSION: '1.15.6'
jobs:
    format-terraform:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
            - name: setup terraform
              uses: hashicorp/setup-terraform@v4
              with:
                terraform_version: ${{ env.TF_VERSION }}
            - name: terraform format check
              run: |
                make tf.fmt.ci
              continue-on-error: false
...
