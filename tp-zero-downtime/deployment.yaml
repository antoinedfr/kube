apiVersion: apps/v1
kind: Deployment

metadata:
  name: demo-web

spec:
  replicas: 3

  selector:
    matchLabels:
      app: demo-web

  template:
    metadata:
      labels:
        app: demo-web

    spec:
      containers:
      - name: nginx
        image: nginx:latest

        ports:
        - containerPort: 80

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 2

---
apiVersion: v1
kind: Service

metadata:
  name: demo-web

spec:
  selector:
    app: demo-web

  ports:
  - port: 80
    targetPort: 80

  type: NodePort